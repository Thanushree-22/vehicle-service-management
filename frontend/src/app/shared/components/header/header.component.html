<ion-header
  class="custom-header">

  <ion-toolbar>

    <ion-buttons
      slot="start"
      *ngIf="showBackButton">

      <ion-button
        (click)="goBack()">

        <ion-icon
          name="arrow-back-outline">
        </ion-icon>

      </ion-button>

    </ion-buttons>


    <ion-title>

      {{ title }}

    </ion-title>


    <ion-buttons
      slot="end"
      *ngIf="showSettings">

      <ion-button
        (click)="goToSettings()">

        <ion-icon
          name="settings-outline">
        </ion-icon>

      </ion-button>

    </ion-buttons>

  </ion-toolbar>

</ion-header>
